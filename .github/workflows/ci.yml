name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter and typecheck
        run: npm run lint

      - name: Install system dependencies (FFmpeg, Tesseract OCR + eng/tha, Fontconfig + DejaVu/Thai fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-tha fontconfig fonts-dejavu-core fonts-thai-tlwg
          sudo fc-cache -f

      - name: Verify native media binaries, fonts, and OCR languages
        run: |
          ffmpeg -version
          ffprobe -version
          tesseract --version
          tesseract --list-langs | grep -qx 'eng'
          tesseract --list-langs | grep -qx 'tha'
          fc-match Sans
          THAI_FONT=$(fc-list :lang=th file | head -n1 | cut -d: -f1 | xargs)
          test -n "$THAI_FONT" && test -f "$THAI_FONT"
          ffmpeg -y -f lavfi -i "color=c=black:s=640x360:d=1,drawtext=text='CI FONT CHECK':fontsize=32:fontcolor=white" -vframes 1 /tmp/ci_drawtext_probe.png
          ffmpeg -y -f lavfi -i "color=c=black:s=640x360:d=1,drawtext=fontfile=${THAI_FONT}:text='ทดสอบ POLICY':fontsize=36:fontcolor=white" -vframes 1 /tmp/ci_thai_drawtext_probe.png
          rm -f /tmp/ci_drawtext_probe.png /tmp/ci_thai_drawtext_probe.png

      - name: Validate environment and plan configuration
        run: npx tsx scripts/validate-env.ts --mode=ci

      - name: Run Master Verification Suites (Suites 1-24)
        run: npm test

      - name: Run security remediation and production enforcement suite
        run: npm run test:security

      - name: Run Phase 4-6 gap closure suite
        run: npm run test:phase4-6

      - name: Run targeted remediation regression suite (FFmpeg/Tesseract real, Whisper contract mocks)
        run: npm run test:regression

      - name: Run checkout origin security and Stripe refund lifecycle suite (test HMAC signatures, mocked SDK)
        run: npm run test:billing

      - name: Run production build
        run: npm run build
